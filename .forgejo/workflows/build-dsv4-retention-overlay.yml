name: verify-dsv4-retention-source

on:
  workflow_dispatch: {}
  push:
    branches:
      - overlay/plat4203-0.21.1-prefix-cache-retention
    paths:
      - overlays/plat4203-0.21.1-prefix-cache-retention/**
      - .forgejo/workflows/build-dsv4-retention-overlay.yml

concurrency:
  group: verify-dsv4-retention-source
  cancel-in-progress: false

jobs:
  verify-build:
    runs-on: deploy-lane
    steps:
      - name: Checkout pinned commit from Origin
        env:
          GIT_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          ASKPASS=$(mktemp)
          trap 'rm -f "$ASKPASS"' EXIT
          cat >"$ASKPASS" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-token-auth ;;
            *) printf '%s\n' "$GIT_PASSWORD" ;;
          esac
          SH
          chmod 700 "$ASKPASS"
          git init .
          git remote add origin http://forgejo-http.origin.svc.cluster.local/shizuha-labs/vllm.git
          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 git fetch --depth=2 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD

      - name: Static sidecar verification
        run: |
          set -euo pipefail
          DIR=overlays/plat4203-0.21.1-prefix-cache-retention
          source "$DIR/base.env"
          test "$VLLM_BASE_IMAGE" = "aidendle94/sparkrun-vllm-ds4-gb10@sha256:f869281d869b2a1d418cade7dcbabe65216cb8f54891d5e2e50718c3dc8b630f"
          grep -Fqx "ARG VLLM_BASE_IMAGE=$VLLM_BASE_IMAGE" "$DIR/Dockerfile"
          test "$(grep -c '^FROM ' "$DIR/Dockerfile")" -eq 1
          grep -Fqx 'FROM ${VLLM_BASE_IMAGE}' "$DIR/Dockerfile"
          python -m py_compile \
            "$DIR/apply_unified_overlay.py" \
            "$DIR/vllm/envs.py" \
            "$DIR/vllm/v1/core/block_pool.py" \
            "$DIR/vllm/v1/core/priority_eviction_queue.py" \
            "$DIR/vllm/entrypoints/openai/chat_completion/protocol_retention.py" \
            "$DIR/vllm/v1/metrics/stats_retention.py" \
            "$DIR/vllm/v1/core/sched/scheduler_retention.py" \
            "$DIR/vllm/v1/metrics/loggers_retention.py"
          grep -Fq ': vllm-timing ' "$DIR/diffs/frontend_timing.patch"
          grep -Fq 'engine_frontend_to_core_ms' "$DIR/diffs/frontend_timing.patch"
          python -m pip install --disable-pip-version-check --no-input 'pytest==8.4.1'
          python -m pytest -q "$DIR/test_retention_overlay.py"
          CONTENT=$(git ls-files "$DIR" | sort | xargs sha256sum | sha256sum | cut -c1-12)
          echo "verified source content rfc37003-${CONTENT}"

      - name: Install pinned kubectl and cluster access
        env:
          PACKAGE_TOKEN: ${{ secrets.ORIGIN_PACKAGE_TOKEN }}
        run: |
          set -euo pipefail
          KUBECTL_ARCH=$(uname -m)
          case "$KUBECTL_ARCH" in
            x86_64) KUBECTL_ARCH=amd64; KUBECTL_SHA=7c81556ac1212213a07180f92eca57db8caef886e58bbad15e9dada10782c10d ;;
            aarch64) KUBECTL_ARCH=arm64; KUBECTL_SHA=2695afc60eea47880ba71c9a01412693b2246c1c76623a352a727db566a6d8b5 ;;
            *) echo "unsupported runner architecture: $KUBECTL_ARCH" >&2; exit 1 ;;
          esac
          AUTH_CONFIG=$(mktemp)
          trap 'rm -f "$AUTH_CONFIG"' EXIT
          chmod 600 "$AUTH_CONFIG"
          printf 'header = "Authorization: token %s"\n' "$PACKAGE_TOKEN" > "$AUTH_CONFIG"
          URL="http://forgejo-http.origin.svc.cluster.local/api/packages/shizuha-labs/generic/kubectl-k3s1/v1.34.6/kubectl-linux-${KUBECTL_ARCH}"
          curl --config "$AUTH_CONFIG" --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 \
            -o kubectl "$URL"
          echo "$KUBECTL_SHA  kubectl" | sha256sum --check
          install -m 0755 kubectl /usr/local/bin/kubectl
          mkdir -p "$HOME/.kube"
          printf '%s' '${{ secrets.KUBE_CONFIG_B64 }}' | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Build immutable ARM64 vendor overlay in cluster
        run: |
          set -euo pipefail
          DIR=overlays/plat4203-0.21.1-prefix-cache-retention
          CONTENT=$(git ls-files "$DIR" | sort | xargs sha256sum | sha256sum | cut -c1-12)
          JOB="ci-build-vllm-retention-${CONTENT}"
          IMAGE="registry.registry.svc.cluster.local:5000/vllm-ds4-sm121:rfc37003-${CONTENT}"
          kubectl delete job -n build "$JOB" --ignore-not-found
          cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: build
            labels: { app: ci-build, service: vllm-dsv4-retention }
          spec:
            backoffLimit: 1
            ttlSecondsAfterFinished: 3600
            template:
              spec:
                restartPolicy: Never
                nodeSelector: { kubernetes.io/arch: arm64 }
                tolerations:
                  - { key: node.shizuha/workstation, operator: Exists, effect: NoSchedule }
                  - { key: shizuha.com/inference-paused, operator: Exists, effect: NoSchedule }
                initContainers:
                  - name: git-clone
                    image: alpine/git:2.43.0
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        set -eu
                        git clone --depth=20 http://x-token-auth:\${GIT_PASSWORD}@forgejo-http.origin.svc.cluster.local/shizuha-labs/vllm.git /workspace/src
                        cd /workspace/src
                        git fetch --depth=20 origin ${{ github.sha }}
                        git checkout --detach ${{ github.sha }}
                    env:
                      - name: GIT_PASSWORD
                        valueFrom: { secretKeyRef: { name: forgejo-token, key: password } }
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                containers:
                  - name: kaniko
                    image: gcr.io/kaniko-project/executor:v1.23.2
                    args:
                      - --context=dir:///workspace/src/${DIR}
                      - --dockerfile=/workspace/src/${DIR}/Dockerfile
                      - --destination=${IMAGE}
                      - --insecure
                      - --skip-tls-verify
                      - --insecure-pull
                      - --registry-mirror=mirror-dockerhub.registry.svc.cluster.local:5000
                      - --cache=false
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                volumes: [{ emptyDir: {}, name: workspace }]
          YAML
          if ! kubectl wait -n build --for=condition=complete "job/${JOB}" --timeout=1800s; then
            kubectl logs -n build "job/${JOB}" --all-containers --tail=120 || true
            exit 1
          fi
          kubectl logs -n build "job/${JOB}" -c kaniko --tail=20

      - name: Qualify exact published image in vendor runtime
        run: |
          set -euo pipefail
          DIR=overlays/plat4203-0.21.1-prefix-cache-retention
          CONTENT=$(git ls-files "$DIR" | sort | xargs sha256sum | sha256sum | cut -c1-12)
          JOB="ci-verify-vllm-retention-${CONTENT}"
          IMAGE="registry.registry.svc.cluster.local:5000/vllm-ds4-sm121:rfc37003-${CONTENT}"
          kubectl delete job -n build "$JOB" --ignore-not-found
          cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: build
            labels: { app: ci-verify, service: vllm-dsv4-retention }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 3600
            template:
              spec:
                restartPolicy: Never
                nodeSelector: { kubernetes.io/arch: arm64 }
                tolerations:
                  - { key: node.shizuha/workstation, operator: Exists, effect: NoSchedule }
                  - { key: shizuha.com/inference-paused, operator: Exists, effect: NoSchedule }
                initContainers:
                  - name: git-clone
                    image: alpine/git:2.43.0
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        set -eu
                        git clone --depth=20 http://x-token-auth:\${GIT_PASSWORD}@forgejo-http.origin.svc.cluster.local/shizuha-labs/vllm.git /workspace/src
                        cd /workspace/src
                        git fetch --depth=20 origin ${{ github.sha }}
                        git checkout --detach ${{ github.sha }}
                    env:
                      - name: GIT_PASSWORD
                        valueFrom: { secretKeyRef: { name: forgejo-token, key: password } }
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                containers:
                  - name: vendor-runtime-gate
                    image: ${IMAGE}
                    imagePullPolicy: Always
                    command: ["/bin/sh", "-lc"]
                    args:
                      - |
                        set -eu
                        /opt/env/bin/python /workspace/src/${DIR}/verify_retention_vendor.py
                        /opt/env/bin/python /workspace/src/${DIR}/verify_hitfix.py
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                volumes: [{ emptyDir: {}, name: workspace }]
          YAML
          if ! kubectl wait -n build --for=condition=complete "job/${JOB}" --timeout=600s; then
            kubectl logs -n build "job/${JOB}" --all-containers --tail=160 || true
            exit 1
          fi
          kubectl logs -n build "job/${JOB}" -c vendor-runtime-gate
          echo "qualified image ${IMAGE}"
