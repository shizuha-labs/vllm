name: pre-commit

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  pre-run-check:
    # GitHub's cross-repository search API is unavailable on Forgejo. Origin
    # relies on its native PR review gate, so skip only this GitHub-specific gate.
    if: github.event_name == 'pull_request' && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
    - name: Check PR label and author merge count
      # Origin runners resolve actions/* against the local actions org mirror.
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const { data: pr } = await github.rest.pulls.get({
            ...context.repo,
            pull_number: context.payload.pull_request.number,
          });

          const hasReadyLabel = pr.labels.some(l => l.name === 'ready');
          const hasVerifiedLabel = pr.labels.some(l => l.name === 'verified');

          const { data: mergedPRs } = await github.rest.search.issuesAndPullRequests({
            q: `repo:${context.repo.owner}/${context.repo.repo} is:pr is:merged author:${pr.user.login}`,
            per_page: 4,
          });
          const mergedCount = mergedPRs.total_count;

          if (hasReadyLabel || hasVerifiedLabel || mergedCount >= 4) {
            core.info(`Check passed: verified label=${hasVerifiedLabel}, ready label=${hasReadyLabel}, 4+ merged PRs=${mergedCount >= 4}`);
          } else {
            core.setFailed(`PR must have the 'verified' or 'ready' (which also triggers tests) label or the author must have at least 4 merged PRs (found ${mergedCount}).`);
          }

  pre-commit:
    needs: pre-run-check
    if: always() && (needs.pre-run-check.result == 'success' || needs.pre-run-check.result == 'skipped')
    # Origin runner labels; the upstream GitHub vllm-runners label is absent here.
    runs-on: [self-hosted, amd64, s1-amd64]
    container:
      image: python:3.12-bookworm
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Check out pull request commit
      shell: bash
      run: |
        set -euo pipefail
        git init .
        git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -c http.extraHeader="Authorization: token ${GITHUB_TOKEN}" fetch --depth=1 origin "${GITHUB_SHA}"
        git checkout --detach FETCH_HEAD
    - name: Install pre-commit tooling
      run: python -m pip install --disable-pip-version-check pre-commit shellcheck-py==0.10.0.1
    - run: echo "::add-matcher::.github/workflows/matchers/actionlint.json"
    - run: echo "::add-matcher::.github/workflows/matchers/markdownlint.json"
    - run: echo "::add-matcher::.github/workflows/matchers/mypy.json"
    - name: Run pre-commit hooks
      run: python -m pre_commit run --all-files --hook-stage manual
